<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot "__PROJECT_ROOT__"
    DirectoryIndex index.php
    AddDefaultCharset UTF-8
    Redirect 302 /favicon.ico /common/favicon.svg
    ErrorLog /var/log/apache2/restaurant-error.log
    CustomLog /var/log/apache2/restaurant-access.log combined
    <Directory "__PROJECT_ROOT__">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)(^\.|^config\.php$|\.(sql|txt|md|sh|py|json|log|patch|gz|flag)$|^LICENSE$|^NOTICE$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <DirectoryMatch "^__PROJECT_REGEX__/(deployment|database|bin|docs|tests|artifacts|\.git|\.agents|\.codex|\.aws)(/|$)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^__PROJECT_REGEX__/(adminSide/inc|customerSide/components)(/|$)">
        Require all denied
    </DirectoryMatch>
    <Directory "__PROJECT_ROOT__/common">
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory "__PROJECT_ROOT__/adminSide/posBackend/fpdf186">
        Require all denied
    </Directory>
    <Files csrf.php>
        Require all denied
    </Files>
    php_admin_flag display_errors Off
    php_admin_flag log_errors On
    php_admin_flag expose_php Off
    php_admin_value error_reporting 32767
    php_admin_value date.timezone Asia/Kuala_Lumpur
    php_admin_flag session.use_strict_mode On
    php_admin_flag session.cookie_httponly On
    php_admin_value session.cookie_samesite Lax
</VirtualHost>
